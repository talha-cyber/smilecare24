<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmileCare24</title>
    <meta http-equiv="refresh" content="0; URL=public/index.html">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(90deg, #FFF, #E6F0F1, #B3D4D8, #66A5AA);
            background-size: 400% 100%;
            animation: gradientBG 15s ease infinite;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .content {
            text-align: center;
            padding: 20px;
        }
        
        h1 {
            color: #034848;
        }
        
        p {
            margin-top: 20px;
        }
        
        a {
            color: #034848;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #034848;
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.3s ease;
            display: inline-block;
            margin-top: 20px;
        }
        
        a:hover {
            background-color: #034848;
            color: white;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>SmileCare24</h1>
        <p>Sie werden weitergeleitet...</p>
        <a href="public/index.html">Wenn Sie nicht automatisch weitergeleitet werden, klicken Sie hier</a>
    </div>
</body>
</html>
