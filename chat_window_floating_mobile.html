<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floating Chat Widget</title>
    <!-- interact.js install command: npm install interactjs -->
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            height: 200vh; /* For scroll testing */
            background: #f0f0f0;
        }

        #chat-widget-container {
            /* No position itself, just a container */
            /* State classes will control children visibility */
        }

        #chat-cta-button {
            position: fixed;
            /* Center horizontally, slightly above vertical center */
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 50px;
            background-color: #007bff;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease-out, opacity 0.3s ease-out;
            color: white;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            opacity: 1;
            pointer-events: auto;
        }
        #chat-cta-button:hover {
             transform: translate(-50%, -50%) scale(1.1);
        }

        /* Hide CTA button when chat window is open */
        #chat-widget-container.state-open #chat-cta-button {
            opacity: 0;
            pointer-events: none;
        }

        #chat-minimized-bubble {
            position: fixed;
            /* Initial position: Middle Right */
            top: 50%;
            right: 20px;
            transform: translateY(-50%); /* Adjust for vertical centering */
            width: 60px;
            height: 60px;
            background-color: #007bff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease-out, opacity 0.3s ease-out, visibility 0s linear 0.3s;
            color: white;
            font-size: 24px;
            z-index: 1000;
            opacity: 0; /* Hidden by default */
            pointer-events: none; /* No interaction by default */
            touch-action: none; /* Needed for interact.js */
            visibility: hidden;
        }
        #chat-minimized-bubble::before {
            content: "💬"; /* Chat icon */
        }
        /* Hover effect removed */

        /* Show minimized bubble only in its state and if not dropped */
        #chat-widget-container.state-minimized-bubble #chat-minimized-bubble:not(.dropped) {
             display: flex;
             opacity: 1;
             pointer-events: auto;
             visibility: visible;
             transition-delay: 0s; /* Ensure visibility transition is immediate */
        }

        /* Class to hide bubble after dropping */
        #chat-minimized-bubble.dropped {
            opacity: 0 !important; /* Ensure override */
            visibility: hidden !important;
            pointer-events: none !important;
        }

        #chat-window {
            display: none; /* Hidden by default */
            position: fixed; /* Use fixed to position relative to viewport */
            top: 50%;
            left: 50%;
            width: 90vw;
            height: 90vh;
            /* Remove max width/height to ensure 90vw/90vh is respected */
            transform: translate(-50%, -50%) scale(0.9); /* Start slightly scaled down */
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            z-index: 1001; /* Needs to be high when open */
            pointer-events: none; /* Prevent interaction when hidden */
            color: #333; /* Default text color */
        }

        /* State: Open Chat Window */
        #chat-widget-container.state-open #chat-window {
            display: flex;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1); /* Scale up to full size */
            pointer-events: auto; /* Allow interaction when open */
        }

        /* Hide bubble when window is open */
        #chat-widget-container.state-open #chat-minimized-bubble {
             display: none;
             opacity: 0;
             pointer-events: none;
        }


        .chat-header {
            background-color: #007bff;
            color: white;
            padding: 12px 18px; /* Slightly more padding */
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1em;
            /* Radius inherited from #chat-window */
            border-top-left-radius: inherit; /* Inherit from parent */
            border-top-right-radius: inherit; /* Inherit from parent */
        }

        .chat-header button {
            background: none;
            border: none;
            color: white;
            font-size: 24px; /* Make minimize bigger */
            line-height: 1;
            padding: 0 5px; /* Easier to tap */
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }
        .chat-header button:hover {
             opacity: 1;
        }

        .chat-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px; /* Adjusted padding */
            background-color: #f9f9f9;
            /* Custom scrollbar (optional, WebKit only) */
            &::-webkit-scrollbar {
                width: 6px;
            }
            &::-webkit-scrollbar-thumb {
                background-color: #ccc;
                border-radius: 3px;
            }
            &::-webkit-scrollbar-track {
                background-color: #f1f1f1;
            }

            /* Prevent bounce effect on scroll */
            overscroll-behavior: contain;
        }
        /* Example message styling */
        .message {
            margin-bottom: 12px; /* Increased spacing */
            padding: 10px 15px; /* More padding */
            border-radius: 18px; /* More rounded */
            max-width: 80%;
            line-height: 1.45; /* Slightly taller lines */
            word-wrap: break-word; /* Prevent overflow */
            clear: both; /* Ensure messages don't overlap floats */
            /* Use table/inline-block for better width containment */
            display: inline-block;
            /* display: table; */ /* Alternative if inline-block has issues */
        }
        .message.sent {
            background-color: #007bff;
            color: white;
            margin-left: auto; /* Push to right */
            border-bottom-right-radius: 5px;
            float: right; /* Align to right */
        }
        .message.received {
             background-color: #e9e9eb;
             color: #333;
             margin-right: auto; /* Push to left */
             border-bottom-left-radius: 5px;
             float: left; /* Align to left */
        }


        .chat-input-area {
            display: flex;
            padding: 12px 15px; /* More padding */
            border-top: 1px solid #eee;
            background-color: white;
            align-items: center; /* Align items vertically */
        }

        .chat-input-area input {
            flex-grow: 1;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 10px 18px; /* Increase padding */
            margin-right: 10px;
            outline: none;
            font-size: 1em;
            transition: border-color 0.2s ease;
        }
        .chat-input-area input:focus {
            border-color: #007bff;
        }

        .chat-input-area button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0; /* Prevent shrinking */
            transition: background-color 0.2s ease;
        }
        .chat-input-area button::before {
            content: "➤"; /* Basic send icon */
            font-size: 18px;
            transform: rotate(-45deg) translateY(1px) translateX(-1px);
        }
        .chat-input-area button:hover {
              background-color: #0056b3;
        }

        #drop-zone {
            /* Circular drop zone, centered in bottom third */
             position: fixed;
            /* Calculate size: bubble (60px) * 1.3 = 78px */
            width: 78px;
            height: 78px;
            /* Position: Horizontally centered, vertically in bottom third */
            bottom: calc(16.66vh - 39px); /* Center vertically in bottom third (viewport_height / 3 * 0.5 = 16.66vh) minus radius (39px) */
            left: 50%;
            transform: translateX(-50%); /* Center horizontally */
            background-color: rgba(255, 0, 0, 0.2); /* More visible background */
            border-radius: 50%; /* Make it circular */
            border: 2px dashed rgba(255, 0, 0, 0.4);
             display: flex;
             justify-content: center;
             align-items: center;
             color: rgba(255, 0, 0, 0.6);
             font-size: 28px; /* Larger X icon */
             font-weight: bold;
             visibility: hidden; /* Hidden by default */
             opacity: 0;
             transition: opacity 0.3s ease, visibility 0s linear 0.3s, background-color 0.2s ease, transform 0.2s ease;
             z-index: 998;
         }
         #drop-zone::before {
             content: "✕"; /* Simple X icon */
         }

        #drop-zone.visible {
            visibility: visible;
            opacity: 1;
            transition: opacity 0.3s ease, visibility 0s linear 0s;
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
             #chat-window {
                 /* 90vw/90vh works well, maybe adjust border radius */
                 border-radius: 5px;
             }
             #chat-cta-button {
                  /* Keep centered or adjust? For now, keep centered */
                  /* Maybe make slightly smaller? */
                  width: 110px;
                  height: 45px;
                  font-size: 14px;
             }
             #chat-minimized-bubble {
                  width: 50px;
                  height: 50px;
                  font-size: 20px;
                  bottom: 10px; /* Keep near bottom on mobile */
                  right: 10px; /* Keep on right edge */
                  top: auto; /* Override desktop top: 50% */
                  transform: none; /* Override desktop transform */
             }
             /* Hover effect removed */
              #drop-zone {
                 /* Adjust size and position for mobile */
                 width: 65px; /* bubble (50px) * 1.3 */
                 height: 65px;
                 bottom: calc(16.66vh - 32.5px);
                 font-size: 24px; /* Adjust icon size */
             }
        }

    </style>
</head>
<body>

<div id="chat-widget-container" class="state-initial"> <!-- Start in initial state -->

    <!-- Always present rectangular CTA Button (hidden when window open) -->
    <div id="chat-cta-button">Chat Now</div>

    <!-- Draggable minimized bubble (only visible when minimized) -->
    <div id="chat-minimized-bubble"></div> <!-- Icon set by CSS -->

    <!-- The main chat window -->
    <div id="chat-window">
        <div class="chat-header">
            <span>Chat with us</span>
            <button id="minimize-chat">_</button> <!-- Placeholder for minimize icon -->
        </div>
        <div class="chat-area" id="chat-area">
            <!-- Example Messages -->
            <div class="message received">Hey there! How can I help you today?</div>
            <div class="message sent">I have a question about pricing.</div>
            <div class="message received">Sure, what would you like to know?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type your message...">
            <button id="send-button">→</button> <!-- Placeholder for send icon -->
        </div>
    </div>
</div>

<div id="drop-zone">X</div>

<script>
    const chatWidgetContainer = document.getElementById('chat-widget-container');
    const chatCtaButton = document.getElementById('chat-cta-button');
    const chatMinimizedBubble = document.getElementById('chat-minimized-bubble');
    const chatWindow = document.getElementById('chat-window');
    const minimizeButton = document.getElementById('minimize-chat');
    const dropZone = document.getElementById('drop-zone');
    const chatArea = document.getElementById('chat-area');
    const chatInput = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-button');

    // --- State ---
    // State is managed by classes on chatWidgetContainer:
    // - state-initial: Shows only CTA button
    // - state-open: Shows only chat window
    // - state-minimized-bubble: Shows CTA button AND minimized bubble
    let isDragging = false; // Flag to prevent click during drag

    // --- Positioning ---
    // Keep track of the minimized bubble's position
    let bubblePosition = { x: 0, y: 0 }; // Relative to initial fixed pos

    // --- Event Listeners ---
    chatCtaButton.addEventListener('click', () => {
        // CTA button always opens the window
        setState('state-open');
    });

    chatMinimizedBubble.addEventListener('click', () => {
         if (!isDragging) {
            // Minimized bubble click also opens the window
            setState('state-open');
        }
        // Reset drag flag after click processing
        setTimeout(() => isDragging = false, 0);
    });

    minimizeButton.addEventListener('click', () => {
        // Minimize should always go to bubble state
        setState('state-minimized-bubble');
    });

    sendButton.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });


    // --- Functions ---
    function setState(newState) {
        const currentState = getCurrentState();
        if (currentState === newState) return; // No change

        // Prevent minimizing if bubble was dropped
        if (newState === 'state-minimized-bubble' && chatMinimizedBubble.classList.contains('dropped')) {
            console.log('Bubble was dropped, cannot minimize. Reverting to initial state.');
            setState('state-initial'); // Go to initial state instead
            return;
        }

        console.log(`Changing state from ${currentState} to ${newState}`);
        chatWidgetContainer.classList.remove('state-initial', 'state-open', 'state-minimized-bubble');
        chatWidgetContainer.classList.add(newState);

        // Reset bubble position when transitioning *away* from minimized state
        // *unless* we are going to the initial state because the bubble was just dropped
        if (currentState === 'state-minimized-bubble' && newState === 'state-open') {
            resetBubblePosition(); // Also removes .dropped class
        } else if (newState === 'state-minimized-bubble') {
             // If we are *entering* minimized state, reset position unless it's currently being dragged
             if (!isDragging) {
                resetBubblePosition(); // Also removes .dropped class
             }
        }


        if (newState === 'state-open') {
             // Window opening logic
             scrollToBottom();
             // Explicitly remove dropped class when opening, ensuring bubble is ready for next minimize
             chatMinimizedBubble.classList.remove('dropped');
        } else if (newState === 'state-minimized-bubble') {
            // Bubble appearing logic - Position is handled by resetBubblePosition / CSS
            document.activeElement.blur();
        } else if (newState === 'state-initial') {
            // Initial state logic (mainly CSS handles this)
            // Ensure bubble position is reset if we enter this state from 'open'
             if (currentState === 'state-open') {
                 resetBubblePosition(); // Reset if closed from open state
             }
             // If entered because bubble was dropped, bubble remains hidden via .dropped class
             document.activeElement.blur();
        }
    }

    function getCurrentState() {
        if (chatWidgetContainer.classList.contains('state-open')) return 'state-open';
        if (chatWidgetContainer.classList.contains('state-minimized-bubble')) return 'state-minimized-bubble';
        return 'state-initial'; // Default
    }


    function toggleChatWindow() {
       const currentState = getCurrentState();
       if (currentState === 'state-initial' || currentState === 'state-minimized-bubble') {
           setState('state-open');
       } else if (currentState === 'state-open') {
           setState('state-minimized-bubble');
       }
    }

    function resetBubblePosition() {
        // Reset drag position state and element style
        console.log('Resetting bubble position');
        bubblePosition = { x: 0, y: 0 };
        // Reset transform to let CSS handle initial positioning
        chatMinimizedBubble.style.transform = '';
        // Ensure the 'dropped' state isn't preventing visibility if we reset explicitly
        chatMinimizedBubble.classList.remove('dropped');
    }

    function sendMessage() {
        const messageText = chatInput.value.trim();
        if (messageText) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', 'sent');
            messageElement.textContent = messageText;
            chatArea.appendChild(messageElement);
            chatInput.value = '';
            scrollToBottom();

            // Simulate receiving a reply (for demo purposes)
            setTimeout(receiveMessage, 1000);
        }
    }

    function receiveMessage() {
         const replyElement = document.createElement('div');
         replyElement.classList.add('message', 'received');
         replyElement.textContent = "Thanks for your message! We'll reply soon.";
         chatArea.appendChild(replyElement);
         scrollToBottom();
    }


    function scrollToBottom() {
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    // --- Drag and Drop Logic (InteractJS for Minimized Bubble) ---
    interact('#chat-minimized-bubble')
        .draggable({
            inertia: true,
            modifiers: [
                interact.modifiers.restrictRect({
                    restriction: 'body', // Keep within the body
                    endOnly: true
                })
            ],
            autoScroll: false,
            listeners: {
                start (event) {
                    // Dragging always starts when interaction begins on the bubble
                    isDragging = true;
                    dropZone.classList.add('visible');
                    chatMinimizedBubble.style.transition = 'none'; // Disable transition during drag
                },
                move (event) {
                    bubblePosition.x += event.dx;
                    bubblePosition.y += event.dy;

                    // Translate the bubble element based on drag delta
                    event.target.style.transform = `translate(${bubblePosition.x}px, ${bubblePosition.y}px)`;

                    // --- Drop Zone Detection (Circular) ---
                    const dropRect = dropZone.getBoundingClientRect();
                    const targetRect = event.target.getBoundingClientRect();
                    const targetCenterX = targetRect.left + targetRect.width / 2;
                    const targetCenterY = targetRect.top + targetRect.height / 2;

                    const dropCenterX = dropRect.left + dropRect.width / 2;
                    const dropCenterY = dropRect.top + dropRect.height / 2;
                    const dropRadius = dropRect.width / 2; // Assuming circular drop zone

                    const distance = Math.sqrt(
                        Math.pow(targetCenterX - dropCenterX, 2) +
                        Math.pow(targetCenterY - dropCenterY, 2)
                    );

                    const isOverDropZone = distance < dropRadius;

                     if (isOverDropZone) {
                        dropZone.style.backgroundColor = 'rgba(255,0,0,0.4)'; // More intense highlight
                        dropZone.style.transform = 'translateX(-50%) scale(1.1)'; // Scale up dropzone slightly
                     } else {
                        dropZone.style.backgroundColor = 'rgba(255,0,0,0.2)'; // Reset background
                        dropZone.style.transform = 'translateX(-50%) scale(1)'; // Reset scale
                     }
                },
                end (event) {
                    if (!isDragging) return; // Don't process end if drag wasn't active

                    // Reset drop zone appearance
                    dropZone.classList.remove('visible');
                    dropZone.style.backgroundColor = 'rgba(255,0,0,0.2)';
                    dropZone.style.transform = 'translateX(-50%) scale(1)';
                    chatMinimizedBubble.style.transition = ''; // Re-enable transition

                    // --- Check if dropped in the zone (Circular) ---
                    const dropRect = dropZone.getBoundingClientRect();
                    const targetRect = event.target.getBoundingClientRect();
                    const targetCenterX = targetRect.left + targetRect.width / 2;
                    const targetCenterY = targetRect.top + targetRect.height / 2;

                    const dropCenterX = dropRect.left + dropRect.width / 2;
                    const dropCenterY = dropRect.top + dropRect.height / 2;
                    const dropRadius = dropRect.width / 2;
                    const distance = Math.sqrt(
                        Math.pow(targetCenterX - dropCenterX, 2) +
                        Math.pow(targetCenterY - dropCenterY, 2)
                    );
                    const isDroppedInZone = distance < dropRadius;


                    if (isDroppedInZone) {
                        // Hide the bubble and go back to initial state (only CTA visible)
                        console.log('Bubble dropped in zone.');
                        chatMinimizedBubble.classList.add('dropped'); // Mark as dropped
                        setState('state-initial'); // Revert to initial state (shows CTA only)
                        // Bubble is hidden by CSS via .dropped class (needs adding)
                    } else {
                        // Optionally snap back to edge if not dropped?
                        // For now, it stays where it was dropped.
                    }

                    // Use setTimeout to reset isDragging after the 'click' event might fire
                    setTimeout(() => {
                        isDragging = false;
                    }, 0);
                }
            }
        });

    // Initial setup
    // Set initial state via class on container element
    // scrollToBottom(); // Scroll only when window is opened

</script>

</body>
</html>
